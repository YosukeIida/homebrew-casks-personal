name: bump casks

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: codex
        run: scripts/bump-codex.sh
        env:
          GH_TOKEN: ${{ github.token }}

      # codex の bump が失敗しても claude-code は進める（job は失敗のまま残る）。
      - id: claude
        if: ${{ !cancelled() }}
        run: scripts/bump-claude-code.sh

      - id: herdr
        if: ${{ !cancelled() }}
        run: scripts/bump-herdr.sh

      - id: ratex
        if: ${{ !cancelled() }}
        run: scripts/bump-ratex.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - id: omlx
        if: ${{ !cancelled() }}
        run: scripts/bump-omlx.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - id: ararat
        if: ${{ !cancelled() }}
        run: scripts/bump-ararat.sh stable
        env:
          GH_TOKEN: ${{ github.token }}

      - id: ararat_preview
        if: ${{ !cancelled() }}
        run: scripts/bump-ararat.sh preview
        env:
          GH_TOKEN: ${{ github.token }}

      - if: ${{ !cancelled() && (steps.codex.outputs.version != '' || steps.claude.outputs.version != '' || steps.herdr.outputs.version != '' || steps.ratex.outputs.version != '' || steps.omlx.outputs.version != '' || steps.ararat.outputs.version != '' || steps.ararat_preview.outputs.version != '') }}
        env:
          CODEX: ${{ steps.codex.outputs.version }}
          CLAUDE: ${{ steps.claude.outputs.version }}
          HERDR: ${{ steps.herdr.outputs.version }}
          RATEX: ${{ steps.ratex.outputs.version }}
          OMLX: ${{ steps.omlx.outputs.version }}
          ARARAT: ${{ steps.ararat.outputs.version }}
          ARARAT_PREVIEW: ${{ steps.ararat_preview.outputs.version }}
        run: |
          parts=()
          [[ -n "$CODEX" ]] && parts+=("codex to $CODEX")
          [[ -n "$CLAUDE" ]] && parts+=("claude-code@latest to $CLAUDE")
          [[ -n "$HERDR" ]] && parts+=("$HERDR")
          [[ -n "$RATEX" ]] && parts+=("ratex to $RATEX")
          [[ -n "$OMLX" ]] && parts+=("$OMLX")
          [[ -n "$ARARAT" ]] && parts+=("$ARARAT")
          [[ -n "$ARARAT_PREVIEW" ]] && parts+=("$ARARAT_PREVIEW")
          msg="feat: update $(IFS=,; echo "${parts[*]}" | sed 's/,/, /g')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks Formula
          git commit -m "$msg"
          git push
